[package]
name = "blockloom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Blockloom: build 2D and 3D games out of blocks."
build = "build.rs"

[[bin]]
name = "blockloom"
path = "src/main.rs"
test = false

[features]
# Development only: enables the QML preview debug service.
qml-preview = []

[dependencies]
blockloom-app = { path = "../blockloom-app" }
blockloom-protocol = { path = "../blockloom-protocol" }
blockstitch-qml.workspace = true
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
base64.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true

# The game world runs inside the editor where its frames can be shared with
# Qt without a copy; elsewhere it stays a child process.
[target.'cfg(target_os = "linux")'.dependencies]
blockloom-runtime = { path = "../blockloom-runtime" }
blockloom-core = { path = "../blockloom-core" }

# Windows shares Vulkan images with Qt through Win32 memory handles.
[target.'cfg(target_os = "windows")'.dependencies]
blockloom-runtime = { path = "../blockloom-runtime" }
blockloom-core = { path = "../blockloom-core" }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
qt-build-utils = { version = "0.10", features = ["qt_minimal"] }
qt-version = { version = "0.1.5", features = ["qt_version_at_least_6_12"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
