[package]
name = "blockloom"
version.workspace = true
edition.workspace = true
description = "Blockloom: build 2D and 3D games out of blocks."
build = "build.rs"

[[bin]]
name = "blockloom"
path = "src/main.rs"
test = false

[dependencies]
blockloom-app = { path = "../blockloom-app" }
blockstitch-qml = { path = "../../blockstitch" }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
base64.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
qt-build-utils = { version = "0.10", features = ["qt_minimal"] }
qt-version = { version = "0.1", features = ["qt_version_at_least_6_10"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
