[package]
name = "blockloom-runtime"
version.workspace = true
edition.workspace = true
description = "The game world: a Bevy app that renders a Blockloom project and runs its blocks."

[[bin]]
name = "blockloom-runtime"
path = "src/main.rs"

[dependencies]
blockloom-core = { path = "../blockloom-core" }
blockloom-protocol = { path = "../blockloom-protocol" }
polyanya.workspace = true
# The tray calls ogg/wav/mp3/flac all audio, so the runtime decodes all of
# them: vorbis already rides with bevy's default `audio` feature.
bevy = { workspace = true, features = ["wav", "mp3", "flac"] }
bevy_rapier2d.workspace = true
bevy_rapier3d.workspace = true
image.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
