[package]
name = "blockloom-runtime"
version.workspace = true
edition.workspace = true
description = "The game world: a Bevy app that renders a Blockloom project and runs its blocks."

[lib]
path = "src/lib.rs"
# The browser player loads as a wasm module; native keeps the rlib.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "blockloom-runtime"
path = "src/main.rs"

[dependencies]
blockloom-core = { path = "../blockloom-core" }
blockloom-protocol = { path = "../blockloom-protocol" }
polyanya.workspace = true
half = "2"
# The key set Bevy hands a schedule build pass (see `hdr::ToneInputs`).
indexmap = "2"
bytemuck = { version = "1.25", features = ["derive"] }
bevy = { workspace = true, features = [
    "wav",
    "mp3",
    "flac",
    "bmp",
    "dds",
    "gif",
    "jpeg",
    "png",
    "tga",
    "webp",
    # Rect lights' LTC tables, light cookies and IES masks, and PCSS.
    "area_light_luts",
    "pbr_light_textures",
    "experimental_pbr_pcss",
] }
bevy_rapier2d.workspace = true
bevy_rapier3d.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# A clock that works in the browser: `std::time::Instant` panics on wasm, and
# the preview state's capture timer starts at boot (see `preview.rs`).
web-time = "1"
# Bevy's own version; the GPU timer needs query sets it doesn't re-export.
wgpu = "30"

# Native script and logic libraries open with `dlopen`; wasm has none, so
# web builds run blocks on the VM and leave scripts unloaded (see script.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
# DOM error overlay and localStorage saves (see `web.rs`). Bevy already
# pulls these for its own web backend, so this adds no new crates.
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Storage",
    "Window",
    "console",
] }

# The embedded Game view hands frames to the editor as dma-bufs, which takes
# the raw Vulkan device under Bevy's wgpu, with the DRM modifier extension
# `raw_vulkan_init` lets it turn on. Versions match Bevy's own.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["raw_vulkan_init"] }
ash = "0.38"

# HDR10 metadata on the DX12 swap chain wgpu makes. Version matches wgpu-hal's.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[features]
default = ["ray_tracing", "compressed_textures"]
# Solari's ray-traced lighting and reference path tracer. Experimental
# upstream, so a build can leave it out; the raster rig is the fallback.
# Always off on web: Solari has no WebGPU backend.
ray_tracing = ["bevy/bevy_solari"]
# KTX2 and Basis Universal texture compression. Needs a C++ toolchain for
# the target, which the wasm target has none of here, so web builds leave
# it out and ship PNG/JPEG instead (see `just web-check`).
compressed_textures = ["bevy/ktx2", "bevy/basis-universal"]

[dev-dependencies]
naga.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
