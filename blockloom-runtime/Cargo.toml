[package]
name = "blockloom-runtime"
version.workspace = true
edition.workspace = true
description = "The game world: a Bevy app that renders a Blockloom project and runs its blocks."

[lib]
path = "src/lib.rs"
# The browser player loads as a wasm module; native keeps the rlib.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "blockloom-runtime"
path = "src/main.rs"

[dependencies]
blockloom-core = { path = "../blockloom-core" }
blockloom-protocol = { path = "../blockloom-protocol" }
tracing-log = { workspace = true }
polyanya.workspace = true
half = "2"
# The key set Bevy hands a schedule build pass (see `hdr::ToneInputs`).
indexmap = "2"
bytemuck = { version = "1.25", features = ["derive"] }
bevy = { workspace = true, features = [
    "wav",
    "mp3",
    "flac",
    "bmp",
    "dds",
    "gif",
    "jpeg",
    "png",
    "tga",
    "webp",
    # Rect lights' LTC tables, light cookies and IES masks.
    "area_light_luts",
    "pbr_light_textures",
] }
bevy_rapier2d.workspace = true
bevy_rapier3d.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# A clock that works in the browser: `std::time::Instant` panics on wasm, and
# the preview state's capture timer starts at boot (see `preview.rs`).
web-time = "1"
# Bevy's own version; the GPU timer needs query sets it doesn't re-export.
wgpu = "30"

# Native script and logic libraries open with `dlopen`; a browser loads
# scripts as wasm modules instead (see script.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading.workspace = true
# PCSS soft shadows. Not in a browser: its blocker search samples depth
# through a filtering sampler, which WebGPU refuses, and Bevy's shaders then
# fall back to hard shadows as they do on WebGL2.
bevy = { workspace = true, features = ["experimental_pbr_pcss"] }

# Android entry and asset reads: the APK's NativeActivity handle behind
# `ANDROID_APP`, which the asset manager and the data dir come from. Same
# Bevy line the workspace pins, so no extra version to track. The manifest
# names the framework's own NativeActivity, so the native-activity backend
# rides along (GameActivity would want Java instead).
[target.'cfg(target_os = "android")'.dependencies]
bevy_android = "0.20.0-rc.2"
bevy = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU, not Bevy's WebGL2 default: the world's compute passes (sky cubes,
# froxel fog, clouds, the luminance meter) need compute and storage textures,
# which WebGL2 has neither of. A browser without WebGPU gets a message.
bevy = { workspace = true, features = ["webgpu"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
# Instantiating script modules (see `script.rs`). Bevy already pulls it.
js-sys = "0.3"
# DOM error overlay, localStorage saves and pointer lock (see `web.rs`).
# Bevy already pulls these for its own web backend, so this adds no new
# crates.
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "Node",
    "Storage",
    "Window",
    "console",
] }

# The embedded Game view hands frames to the editor as dma-bufs, which takes
# the raw Vulkan device under Bevy's wgpu, with the DRM modifier extension
# `raw_vulkan_init` lets it turn on. Versions match Bevy's own.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["raw_vulkan_init"] }
ash = "0.38"

# HDR10 metadata on the DX12 swap chain wgpu makes. Version matches wgpu-hal's.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[features]
default = ["ray_tracing", "compressed_textures"]
# Solari's ray-traced lighting and reference path tracer. Experimental
# upstream, so a build can leave it out; the raster rig is the fallback.
# Always off on web: Solari has no WebGPU backend.
ray_tracing = ["bevy/bevy_solari"]
# KTX2 and Basis Universal texture compression. Needs a C++ toolchain for
# the target, which the wasm target has none of here, so web builds leave
# it out and ship PNG/JPEG instead (see `just web-check`).
compressed_textures = ["bevy/ktx2", "bevy/basis-universal"]
# NVIDIA DLSS Super Resolution (and Ray Reconstruction for Solari) through
# Bevy's `dlss` path. Off by default: building it needs the DLSS SDK
# (`DLSS_SDK` set to an absolute path), the Vulkan SDK, clang, and agreement
# to NVIDIA's SDK license. Needs an RTX GPU, Vulkan, and the redistributable
# DLLs beside the player at run time; otherwise the probe reports unavailable
# and the TAA plus spatial fallback carries on. Never on web.
dlss = ["bevy/dlss"]

[dev-dependencies]
naga.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
