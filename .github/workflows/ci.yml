name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Master runs finish so rust-cache saves and every commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes a Bevy target dir too big for the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version and its components.
      - run: rustup toolchain install
      - run: bash scripts/prepare-patched-deps.sh
      - run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version and its components.
      - run: rustup toolchain install
      - name: Install Bevy's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1
      - run: bash scripts/test-patched-deps.sh
      - run: bash scripts/prepare-patched-deps.sh
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: >
          cargo clippy --all-targets
          -p blockloom-core -p blockloom-protocol -p blockloom-app -p blockloom-runtime
      # GPU tests are #[ignore]d and stay manual. Tests that only start the
      # renderer run on lavapipe, Mesa's software Vulkan.
      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          BLOCKLOOM_TEST_OPAQUE_FD: 1
        run: >
          cargo test
          -p blockloom-core -p blockloom-protocol -p blockloom-app -p blockloom-runtime

  # The browser player (Phase 8): the runtime has to keep building for wasm,
  # and a script has to keep compiling to a wasm module. The headless smoke
  # run (`just web-smoke`) needs a WebGPU browser and stays manual.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - run: bash scripts/prepare-patched-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - name: Clippy (wasm32)
        run: >
          cargo clippy -p blockloom-runtime --no-default-features
          --target wasm32-unknown-unknown
      - name: Scripts compile for the web
        run: >
          cargo test -p blockloom-core --lib
          script::tests::a_script_built_for_the_web_is_a_module_importing_the_host_calls

  # The Android player (Phase 6.5): the runtime has to keep checking for both
  # Android triples, built the way the APK builds it (no default features).
  # No SDK install: a standalone NDK feeds the C build scripts, and the Rust
  # std comes from rustup. Installs and emulator runs stay manual
  # (`just android-smoke`).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: bash scripts/prepare-patched-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Fetch the pinned NDK major
        run: |
          curl -sS -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          ls /tmp/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/ \
            | grep -E "29-clang$|llvm-ar"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Check the shipped shape
        run: just android-runtime-check /tmp/android-ndk-r27d
