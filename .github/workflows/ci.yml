name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes a Bevy target dir too big for the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # blockloom-qt path-depends on a blockstitch-qml checkout that CI doesn't
      # have (and needs Qt), so the workspace only loads without it.
      - name: Drop the editor crate from the workspace
        run: sed -i '/^    "blockloom-qt",$/d' Cargo.toml
      - run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Drop the editor crate from the workspace
        run: sed -i '/^    "blockloom-qt",$/d' Cargo.toml
      - name: Install Bevy's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: >
          cargo clippy --all-targets
          -p blockloom-core -p blockloom-protocol -p blockloom-app -p blockloom-runtime
      # GPU tests are #[ignore]d and stay manual.
      - name: Test
        run: >
          cargo test
          -p blockloom-core -p blockloom-protocol -p blockloom-app -p blockloom-runtime
