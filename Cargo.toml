[workspace]
members = [
    "blockloom-hub",
    "blockloom-qt",
    "blockloom-app",
    "blockloom-core",
    "blockloom-protocol",
    "blockloom-runtime",
    "blockloom-plugin-api",
    "blockloom-plugin-host",
    "blockloom-plugin-sdk",
    "plugins/examples/tally",
]
resolver = "2"

default-members = [
    "blockloom-qt",
    "blockloom-app",
    "blockloom-core",
    "blockloom-protocol",
    "blockloom-plugin-api",
    "blockloom-plugin-host",
    "blockloom-plugin-sdk",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
# Both halves come from one blockstitch commit; `just blockstitch-published`
# moves them together and `just blockstitch-local` overrides both.
blockstitch-core = { git = "https://github.com/Blockworked/blockstitch", rev = "fa100f5e" }
blockstitch-qml = { git = "https://github.com/Blockworked/blockstitch", rev = "fa100f5e" }
bevy = "0.20.0-rc.2"
# No 0.20 release yet: the bindings moved into the rapier monorepo, which
# tracks Bevy's main. Patched onto the RC below until a release lands.
bevy_rapier2d = { git = "https://github.com/dimforge/rapier", rev = "09ca067a" }
bevy_rapier3d = { git = "https://github.com/dimforge/rapier", rev = "09ca067a" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.0", features = ["sync"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }
dirs = "7.0.0"
base64 = "0.22.1"
glam = "0.32"
# The version Bevy compiles shaders with, so a surface shader the editor
# accepts is one the GPU pipeline accepts too.
naga = { version = "30", features = ["wgsl-in"] }
# Same source as Bevy's WESL support, for validating surface shaders offline.
wesl = { version = "0.4.4" }
# For the parse-error type in that validation (source snippets in reports).
wgsl-parse = { version = "0.4.4" }
polyanya = { version = "0.17", default-features = false }
libloading = "0.9.0"
# Portable dispatch keeps the interpreter loop-based: the default tail-call
# dispatch relies on LLVM sibling-call optimisation and overflowed the stack
# on a runaway module in a debug-assertions build.
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "memory64", "portable-dispatch"] }
wat = "1.260.0"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "dds", "exr", "gif", "hdr", "jpeg", "png", "tga", "webp"] }
ico = "0.5.0"
flate2 = "1.1.10"
crc32fast = "1.5.2"
semver = { version = "1.0.28", features = ["serde"] }
sha2 = "0.10.9"
tempfile = "3.27.0"

# The runtime process renders a live game world; a debug-speed Bevy is
# unusable, so its dependencies stay optimized even in a debug build.
[profile.dev.package."*"]
opt-level = 3

# Reuse compiled work across the editor's release edit-run cycle.
[profile.release]
incremental = true

# The player a built game ships. It is compiled once and run for hours, so it
# is worth the slow link that would make `just build`'s edit-run loop painful.
# Panics stay unwound: `blockloom::export!` catches a script's panic rather
# than letting it cross the C boundary and abort the window.
[profile.dist]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
strip = "symbols"

# bevy_rapier's git master depends on Bevy's main; build it against the RC.
[patch."https://github.com/bevyengine/bevy"]
bevy = "0.20.0-rc.2"

# Generated from pinned release archives and patches/ by
# `just prepare-patched-deps`. See patches/README.md for the Mali workarounds.
[patch.crates-io]
wgpu-hal = { path = ".patched-deps/wgpu-hal" }
bevy_pbr = { path = ".patched-deps/bevy-pbr" }
