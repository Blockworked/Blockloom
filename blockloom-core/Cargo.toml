[package]
name = "blockloom-core"
version.workspace = true
edition.workspace = true
description = "Blockloom's engine library: the project document, block vocabulary, VM and sensor state."

[dependencies]
blockstitch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
glam.workspace = true
naga.workspace = true
wesl.workspace = true
wgsl-parse.workspace = true
polyanya.workspace = true
dirs.workspace = true
base64.workspace = true
tracing.workspace = true
image.workspace = true
ico.workspace = true
flate2.workspace = true
crc32fast.workspace = true
half = "2"
rustc-hash = "2"
# SDK downloads (Android cmdline-tools) over HTTPS, and unzipping them.
# Both are pure Rust so the wasm build keeps working.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zip = { version = "7.2", default-features = false, features = ["deflate"] }

# Web builds (`wasm32-unknown-unknown`) need the JS-backed RNG: getrandom
# refuses the wasm target by default, and everything id generation and Bevy
# math reach for it through here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# uuid's v4 RNG needs a wasm source too, or it refuses to compile.
uuid = { workspace = true, features = ["js"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]

[[bench]]
name = "vm"
harness = false
