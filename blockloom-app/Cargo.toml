[package]
name = "blockloom-app"
version.workspace = true
edition.workspace = true
description = "Blockloom's backend: every command the editor issues, and the state it edits."

[features]
# A browser-reachable HTTP/WebSocket bridge onto the same commands, for
# iterating on the frontend with `pnpm run dev` instead of relaunching CEF.
dev-bridge = ["dep:axum", "dep:tower-http"]

[[bin]]
name = "blockloom-devserver"
path = "src/bin/devserver.rs"
required-features = ["dev-bridge"]

# The agent shell: a backend driven on stdin, one shell command per line.
[[bin]]
name = "blockloom-shell"
path = "src/bin/shell.rs"

[dependencies]
blockloom-core = { path = "../blockloom-core" }
blockloom-protocol = { path = "../blockloom-protocol" }
blockloom-plugin-api = { path = "../blockloom-plugin-api" }
blockloom-plugin-host = { path = "../blockloom-plugin-host" }
blockstitch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
uuid.workspace = true
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
image.workspace = true
base64.workspace = true
# The emulator's own screen and touch service (see `screen::grpc`): a
# client only, no codegen, no TLS.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "server", "router"] }
tokio-stream = "0.1"
