[package]
name = "blockloom-plugin-host"
version.workspace = true
edition.workspace = true
description = "Installs, resolves and runs plugin packages: cache, lockfile, lifecycle and loaders."

[dependencies]
blockloom-plugin-api = { path = "../blockloom-plugin-api" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
wasmi.workspace = true
wat = { workspace = true, optional = true }
dirs.workspace = true
zip = { version = "7.2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading.workspace = true

[features]
test-fixtures = ["dep:wat"]

[dev-dependencies]
tempfile.workspace = true
wat.workspace = true
